<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My profile')}"></head>
<body>
	<header th:replace="~{fragments :: navbar('profile')}"></header>

	<main class="container">
		<div class="card card-pad form-card">
			<h1 style="font-size:1.7rem">My profile</h1>
			<form th:action="@{/shop/profile}" th:object="${form}" method="post" action="/shop/profile" novalidate>
				<div class="field">
					<label for="email">Email</label>
					<input type="email" id="email" th:value="${email}" disabled />
					<span class="hint">Your email is your login and cannot be changed here.</span>
				</div>
				<div class="field">
					<label for="uname">Full name</label>
					<input type="text" id="uname" th:field="*{uname}" th:classappend="${#fields.hasErrors('uname')} ? 'invalid'" required />
					<span class="field-error" th:if="${#fields.hasErrors('uname')}" th:errors="*{uname}"></span>
				</div>
				<div class="field">
					<label for="unumber">Mobile number</label>
					<input type="tel" id="unumber" th:field="*{unumber}" th:classappend="${#fields.hasErrors('unumber')} ? 'invalid'" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required />
					<span class="field-error" th:if="${#fields.hasErrors('unumber')}" th:errors="*{unumber}"></span>
				</div>

				<h3 style="margin-top:1.5rem">Change password <small class="muted" style="font-family:var(--font);font-weight:400">(optional)</small></h3>
				<div class="field">
					<label for="currentPassword">Current password</label>
					<input type="password" id="currentPassword" th:field="*{currentPassword}" th:classappend="${#fields.hasErrors('currentPassword')} ? 'invalid'" autocomplete="current-password" />
					<span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
				</div>
				<div class="field">
					<label for="newPassword">New password</label>
					<div class="password-wrap">
						<input type="password" id="newPassword" th:field="*{newPassword}" th:classappend="${#fields.hasErrors('newPassword')} ? 'invalid'" minlength="6" maxlength="64" autocomplete="new-password" data-strength="#strength" />
						<button type="button" data-toggle-password aria-label="Show password">Show</button>
					</div>
					<div class="strength" id="strength"><span></span></div>
					<span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
				</div>

				<div class="form-actions">
					<button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> Save changes</button>
					<a class="btn btn-ghost" th:href="@{/shop}" href="/shop">Back to shop</a>
				</div>
			</form>
		</div>
	</main>

	<footer th:replace="~{fragments :: footer}"></footer>
	<th:block th:replace="~{fragments :: foot}"></th:block>
</body>
</html>
