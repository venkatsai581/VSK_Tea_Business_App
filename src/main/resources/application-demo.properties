# Run without MySQL:   ./mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Uses an in-memory H2 database (data is lost when the app stops).
spring.datasource.url=jdbc:h2:mem:business;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.seed.demo-user=true
