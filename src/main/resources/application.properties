# ---------- Database (MySQL) ----------
# The database is created automatically if it does not exist (createDatabaseIfNotExist=true).
# Change the values below, or set the DB_URL / DB_USER / DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/business_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---------- Web ----------
server.port=9090
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# ---------- First-run data ----------
# When the database has no admin, one is created with these details (change the password after logging in!).
app.default-admin.email=admin@business.com
app.default-admin.password=Admin@123
# When there are no products, a few sample tea products are added.
app.seed.sample-products=true
