<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(${editing} ? 'Edit customer' : 'Add customer')}"></head>
<body>
	<header th:replace="~{fragments :: navbar('admin')}"></header>

	<main class="container">
		<div class="card card-pad form-card">
			<h1 style="font-size:1.7rem" th:text="${editing} ? 'Edit customer' : 'Add a new customer'">Add a new customer</h1>
			<form th:action="${editing} ? @{/admin/users/{id}(id=${targetId})} : @{/admin/users}" th:object="${form}" method="post" action="/admin/users" novalidate>
				<div class="field">
					<label for="uname">Name</label>
					<input type="text" id="uname" th:field="*{uname}" th:classappend="${#fields.hasErrors('uname')} ? 'invalid'" placeholder="Full name" required />
					<span class="field-error" th:if="${#fields.hasErrors('uname')}" th:errors="*{uname}"></span>
				</div>
				<div class="field">
					<label for="uemail">Email</label>
					<input type="email" id="uemail" th:field="*{uemail}" th:classappend="${#fields.hasErrors('uemail')} ? 'invalid'" placeholder="customer@example.com" required />
					<span class="field-error" th:if="${#fields.hasErrors('uemail')}" th:errors="*{uemail}"></span>
				</div>
				<div class="field">
					<label for="unumber">Mobile number</label>
					<input type="tel" id="unumber" th:field="*{unumber}" th:classappend="${#fields.hasErrors('unumber')} ? 'invalid'" placeholder="10 digit number" inputmode="numeric" maxlength="10" pattern="[0-9]{10}" required />
					<span class="field-error" th:if="${#fields.hasErrors('unumber')}" th:errors="*{unumber}"></span>
				</div>
				<div class="field">
					<label for="upassword">Password</label>
					<div class="password-wrap">
						<input type="password" id="upassword" th:field="*{upassword}" th:classappend="${#fields.hasErrors('upassword')} ? 'invalid'" th:placeholder="${editing} ? 'Leave empty to keep the current password' : 'At least 6 characters'" minlength="6" maxlength="64" autocomplete="new-password" data-strength="#strength" th:required="${!editing}" />
						<button type="button" data-toggle-password aria-label="Show password">Show</button>
					</div>
					<div class="strength" id="strength"><span></span></div>
					<span class="field-error" th:if="${#fields.hasErrors('upassword')}" th:errors="*{upassword}"></span>
				</div>
				<div class="form-actions">
					<button type="submit" class="btn"><i class="fa-solid fa-floppy-disk"></i> <span th:text="${editing} ? 'Save changes' : 'Add customer'">Save</span></button>
					<a class="btn btn-ghost" th:href="@{/admin/services#users}" href="/admin/services#users">Cancel</a>
				</div>
			</form>
		</div>
	</main>

	<footer th:replace="~{fragments :: footer}"></footer>
	<th:block th:replace="~{fragments :: foot}"></th:block>
</body>
</html>
