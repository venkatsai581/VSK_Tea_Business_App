<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order placed')}"></head>
<body>
	<header th:replace="~{fragments :: navbar('shop')}"></header>

	<main class="container">
		<div class="card success-card">
			<div class="check"><i class="fa-solid fa-check"></i></div>
			<h1 style="font-size:1.8rem">Order placed!</h1>
			<p class="muted">Thank you, <span th:text="${session.userName}">friend</span>. We have received your order.</p>
			<div class="summary">
				<div><span class="muted">Order number</span><strong th:text="'#' + ${order.oId}">#1</strong></div>
				<div><span class="muted">Product</span><strong th:text="${order.oName}">Tea</strong></div>
				<div><span class="muted">Quantity</span><strong th:text="${order.oQuantity} + ' kg'">1 kg</strong></div>
				<div><span class="muted">Price per kg</span><strong th:text="'₹ ' + ${#numbers.formatDecimal(order.oPrice, 1, 'COMMA', 2, 'POINT')}">0</strong></div>
				<div><span class="muted">Total amount</span><strong style="color:var(--primary-strong);font-size:1.2rem" th:text="'₹ ' + ${#numbers.formatDecimal(order.totalAmmout, 1, 'COMMA', 2, 'POINT')}">0</strong></div>
			</div>
			<div class="form-actions" style="justify-content:center">
				<a class="btn" th:href="@{/shop}" href="/shop"><i class="fa-solid fa-store"></i> Keep shopping</a>
				<a class="btn btn-ghost" th:href="@{/shop/orders}" href="/shop/orders">View my orders</a>
			</div>
		</div>
	</main>

	<footer th:replace="~{fragments :: footer}"></footer>
	<th:block th:replace="~{fragments :: foot}"></th:block>
</body>
</html>
