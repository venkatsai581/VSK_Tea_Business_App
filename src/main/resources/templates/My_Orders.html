<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('My orders')}"></head>
<body>
	<header th:replace="~{fragments :: navbar('orders')}"></header>

	<main class="container">
		<div class="page-head">
			<h1>My orders</h1>
			<p class="muted">You can cancel an order while it is still <em>placed</em>.</p>
		</div>

		<div class="table-wrap" th:if="${!#lists.isEmpty(orders)}">
			<table class="stack">
				<thead>
					<tr>
						<th data-sort="number">Order</th>
						<th data-sort>Product</th>
						<th data-sort="number">Price / kg</th>
						<th data-sort="number">Qty (kg)</th>
						<th data-sort="number">Total</th>
						<th data-sort>Date</th>
						<th data-sort>Status</th>
						<th></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="o : ${orders}">
						<td data-label="Order" th:text="'#' + ${o.oId}" th:attr="data-value=${o.oId}">#1</td>
						<td data-label="Product" th:text="${o.oName}">Tea</td>
						<td data-label="Price / kg" th:text="'₹ ' + ${#numbers.formatDecimal(o.oPrice, 1, 'COMMA', 2, 'POINT')}" th:attr="data-value=${o.oPrice}">0</td>
						<td data-label="Qty (kg)" th:text="${o.oQuantity}">1</td>
						<td data-label="Total" th:text="'₹ ' + ${#numbers.formatDecimal(o.totalAmmout, 1, 'COMMA', 2, 'POINT')}" th:attr="data-value=${o.totalAmmout}">0</td>
						<td data-label="Date" th:text="${#dates.format(o.orderDate, 'dd MMM yyyy, HH:mm')}" th:attr="data-value=${o.orderDate != null ? o.orderDate.time : 0}">-</td>
						<td data-label="Status"><span class="badge" th:classappend="'badge-' + ${o.status}" th:text="${o.status}">PLACED</span></td>
						<td class="actions">
							<form th:if="${o.status == 'PLACED'}" th:action="@{/shop/orders/{id}/cancel(id=${o.oId})}" method="post" data-confirm="Cancel this order?">
								<button type="submit" class="btn btn-sm btn-ghost"><i class="fa-solid fa-ban"></i> Cancel</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

		<div class="empty" th:if="${#lists.isEmpty(orders)}">
			<i class="fa-solid fa-receipt"></i>
			<p>You have not placed any orders yet.</p>
			<a class="btn" th:href="@{/shop}" href="/shop">Start shopping</a>
		</div>
	</main>

	<footer th:replace="~{fragments :: footer}"></footer>
	<th:block th:replace="~{fragments :: foot}"></th:block>
</body>
</html>
