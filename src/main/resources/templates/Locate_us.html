<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Locate us')}"></head>
<body>
	<header th:replace="~{fragments :: navbar('location')}"></header>

	<main class="container">
		<div class="page-head">
			<h1>Our location</h1>
			<p class="muted"><i class="fa-solid fa-wifi"></i> An internet connection is needed to load the map.</p>
		</div>
		<iframe class="map-frame" title="Map showing our location" loading="lazy" allowfullscreen
			referrerpolicy="no-referrer-when-downgrade"

	</main>

	<footer th:replace="~{fragments :: footer}"></footer>
	<th:block th:replace="~{fragments :: foot}"></th:block>
</body>
</html>
